services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/polarislex
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POLARIS_LAW_DIR: /app/laws
      VECTORIZATION_QDRANT_URL: http://qdrant:6333
      VECTORIZATION_OLLAMA_URL: http://host.docker.internal:11434/api/embeddings
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_data:
  neo4j_data:
