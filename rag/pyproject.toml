[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag"
version = "0.1.0"
description = "Statute Q&A: dense RAG vs GraphRAG (not /analyze)"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "PolarisLex Team" }]
dependencies = [
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "vectorization",
    "compliance",
    "graph-builder",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
rag-bench = "rag.bench:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../vectorization/src", "../compliance/src", "../graph_builder/src", "../document_pipeline/src", "../policy_compare/src"]
addopts = "-ra"
markers = ["live: needs running Qdrant and Ollama"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
