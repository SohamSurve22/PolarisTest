[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-compare"
version = "0.1.0"
description = "Project a website privacy-policy graph and overlay it against an ideal law-topic graph"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "PolarisLex Team" }]
dependencies = [
    "pydantic>=2.6.0",
    "document-pipeline",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../document_pipeline/src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
