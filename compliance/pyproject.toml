[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance"
version = "0.1.0"
description = "India/DPDP compliance analysis: obligations, gaps, and penalties"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "PolarisLex Team" }]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "reportlab>=4.0.0",
    "document-pipeline",
    "policy-compare",
    "vectorization",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../document_pipeline/src", "../policy_compare/src", "../vectorization/src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
